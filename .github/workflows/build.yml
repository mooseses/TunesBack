name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Print smoke-test screenshots to the log"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e . pytest

      - name: Run tests
        run: pytest -q

  build:
    name: Build ${{ matrix.name }}
    needs: test
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            name: macOS
          - os: windows-latest
            platform: windows
            name: Windows
          # 22.04 keeps the glibc requirement low (2.35), so the build runs on most distributions.
          - os: ubuntu-22.04
            platform: linux
            name: Linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        shell: bash
        run: |
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        if: matrix.platform != 'linux'
        run: pip install . pyinstaller

      # Linux builds bundle Qt and QtWebEngine (pip wheels) rather than relying on
      # the system's WebKitGTK. The apt packages are what Qt needs at run time
      # plus the virtual display used by the smoke test.
      - name: Install (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2 libdbus-1-3 \
            xvfb openbox xdotool imagemagick desktop-file-utils
          pip install ".[qt]" pyinstaller

      # With a LASTFM_API_KEY repository secret, the app comes with a Last.fm key
      # and set-up doesn't ask for one.
      - name: Bundle a Last.fm API key
        if: env.LASTFM_API_KEY != ''
        shell: bash
        run: printf 'LASTFM_API_KEY = "%s"\n' "$LASTFM_API_KEY" > tunesback/_build.py

      - name: Build app
        run: pyinstaller packaging/tunesback.spec --noconfirm
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      # The packaged app draws a few cards from made-up data: proves resvg, the
      # bundled fonts and a system font for other scripts all work once frozen.
      - name: Draw sample cards
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows) EXE=dist/TunesBack/tunesback.exe ;;
            macos) EXE=dist/TunesBack.app/Contents/MacOS/tunesback ;;
            *) EXE=dist/TunesBack/tunesback ;;
          esac
          "$EXE" --selftest cards.jpg
          test -s cards.jpg
          cat cards.jpg.txt
          if [ "${{ inputs.screenshots || 'false' }}" = "true" ]; then
            python -c "import base64; d = base64.b64encode(open('cards.jpg', 'rb').read()).decode(); [print('SHOT cards', d[i:i + 4000]) for i in range(0, len(d), 4000)]; print('SHOT cards END')"
          fi

      # Launch the built app and drive its title bar with real mouse input.
      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./packaging/smoke/windows.ps1 -Exe dist\TunesBack\tunesback.exe -Fixtures tests\fixtures -Screenshots "${{ inputs.screenshots || 'false' }}"

      - name: Smoke test (macOS)
        if: matrix.platform == 'macos'
        run: python packaging/smoke/macos.py dist/TunesBack.app/Contents/MacOS/tunesback tests/fixtures "${{ inputs.screenshots || 'false' }}"

      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: packaging/smoke/linux.sh dist/TunesBack/tunesback "${{ inputs.screenshots || 'false' }}"

      # ========== macOS: Create DMG ==========
      - name: Create macOS DMG
        if: matrix.platform == 'macos'
        run: |
          brew install create-dmg
          DMG="TunesBack-macOS-v${{ env.APP_VERSION }}-arm64.dmg"

          if [ ! -d "dist/TunesBack.app" ]; then
            echo "Error: TunesBack.app not found in dist/"
            exit 1
          fi

          create-dmg \
            --volname "TunesBack" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "TunesBack.app" 200 190 \
            --hide-extension "TunesBack.app" \
            --app-drop-link 600 185 \
            "$DMG" \
            "dist/TunesBack.app" || true

          if [ ! -f "$DMG" ]; then
            echo "create-dmg failed, using hdiutil..."
            hdiutil create -volname "TunesBack" -srcfolder "dist/TunesBack.app" -ov -format UDZO "$DMG"
          fi

      # ========== Windows: Create Installer ==========
      - name: Create Windows Installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y
          Start-Sleep -Seconds 5

          $issContent = @"
          [Setup]
          AppName=TunesBack
          AppVersion=${{ env.APP_VERSION }}
          AppPublisher=Mooseses
          DefaultDirName={autopf}\TunesBack
          DefaultGroupName=TunesBack
          UninstallDisplayIcon={app}\tunesback.exe
          SetupIconFile=packaging\icon.ico
          Compression=lzma2
          SolidCompression=yes
          OutputDir=.
          OutputBaseFilename=TunesBack-Windows-v${{ env.APP_VERSION }}-x64
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern

          [Files]
          Source: "dist\TunesBack\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\TunesBack"; Filename: "{app}\tunesback.exe"
          Name: "{autodesktop}\TunesBack"; Filename: "{app}\tunesback.exe"; Tasks: desktopicon
          Name: "{group}\Uninstall TunesBack"; Filename: "{uninstallexe}"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\tunesback.exe"; Description: "Launch TunesBack"; Flags: nowait postinstall skipifsilent
          "@

          $issContent | Out-File -FilePath "installer.iss" -Encoding ASCII
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      # ========== Linux: AppImage and tarball ==========
      - name: Create Linux AppImage and tarball
        if: matrix.platform == 'linux'
        run: |
          BASE="TunesBack-Linux-v${{ env.APP_VERSION }}-x86_64"
          tar -C dist -czf "$BASE.tar.gz" TunesBack

          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          cp -a dist/TunesBack AppDir/TunesBack
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp packaging/linux/tunesback.desktop AppDir/
          cp tunesback/assets/icon.png AppDir/tunesback.png
          cp tunesback/assets/icon.png AppDir/.DirIcon
          cp tunesback/assets/icon.png AppDir/usr/share/icons/hicolor/512x512/apps/tunesback.png
          desktop-file-validate AppDir/tunesback.desktop

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "$BASE.AppImage"
          chmod +x "$BASE.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "./$BASE.AppImage" --version

      # ========== Upload Artifacts ==========
      - name: Upload macOS artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: TunesBack-macOS-v${{ env.APP_VERSION }}-arm64
          path: TunesBack-macOS-v${{ env.APP_VERSION }}-arm64.dmg

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: TunesBack-Windows-v${{ env.APP_VERSION }}-x64
          path: TunesBack-Windows-v${{ env.APP_VERSION }}-x64.exe

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: TunesBack-Linux-v${{ env.APP_VERSION }}-x86_64
          path: |
            TunesBack-Linux-v${{ env.APP_VERSION }}-x86_64.AppImage
            TunesBack-Linux-v${{ env.APP_VERSION }}-x86_64.tar.gz
