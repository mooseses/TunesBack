[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunesback"
version = "2.0.0b1"
description = "Year-in-review statistics for your music library"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Peter Jin" }]
requires-python = ">=3.10"
dependencies = [
  "pywebview>=5.0",
  "mutagen>=1.45",
  "Pillow>=10.1",
  "python-dateutil>=2.8",
  "resvg-py>=0.5",
]

[project.optional-dependencies]
qt = ["pywebview[qt]>=5.0"]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.scripts]
tunesback = "tunesback.__main__:main"

[project.urls]
Homepage = "https://github.com/mooseses/TunesBack"

[tool.setuptools.packages.find]
include = ["tunesback*"]

[tool.setuptools.package-data]
tunesback = ["assets/*", "assets/fonts/*", "web/*", "web/js/*", "web/js/views/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
